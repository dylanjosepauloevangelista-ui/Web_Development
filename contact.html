
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PiliTek | Feedback</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  
  <header>
    <nav class="navbar">
      <h1>PiliTek</h1>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="comparison.html">Comparison</a></li>
        <li><a class="active" href="contact.html">Feedback</a></li>
      </ul>
    </nav>
  </header>
  
  <main class="content">
    <h2>Send Your Feedback</h2>
    <p>Tell us what you think about PiliTek.</p>
    
    <form action="#" method="get">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" placeholder="Enter your name" required>
      
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="Enter your email" required>
      
      <label for="message">Feedback</label>
      <textarea id="message" name="message" rows="5" placeholder="Write your feedback" required></textarea>
      
      <button type="submit">Submit Feedback</button>
    </form>
    
    <p class="note">This sample form does not save feedback to a database.
      A working submission system would need additional setup.</p>
  </main>
  
  <footer>
    <p>PiliTek | Created by: Dylan Jose P. Evangelista</p>
  </footer>
  
</body>

</html>
